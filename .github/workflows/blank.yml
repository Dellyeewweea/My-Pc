
#!/data/data/com.termux/files/usr/bin/bash
set -eu

BASE="$HOME/pc-virtual"
mkdir -p "$BASE"/{discos,isos,config}

if ! command -v qemu-system-x86_64 >/dev/null 2>&1; then
    echo "QEMU x86_64 não encontrado."
    echo "Verifique os pacotes disponíveis no Termux."
    exit 1
fi

if ! command -v qemu-img >/dev/null 2>&1; then
    echo "O utilitário qemu-img não está instalado."
    exit 1
fi

DISK="$BASE/discos/pc-virtual.qcow2"

if [ ! -f "$DISK" ]; then
    qemu-img create -f qcow2 "$DISK" 16G
fi

cat > "$BASE/iniciar-pc.sh" <<'EOF'
#!/data/data/com.termux/files/usr/bin/bash
set -eu

BASE="$HOME/pc-virtual"
DISK="$BASE/discos/pc-virtual.qcow2"
ISO="$BASE/isos/sistema.iso"

if [ ! -f "$ISO" ]; then
    echo "Coloque uma ISO inicializável em:"
    echo "$ISO"
    exit 1
fi

exec qemu-system-x86_64 \
    -machine q35 \
    -accel tcg,thread=multi \
    -smp 2 \
    -m 1024 \
    -drive file="$DISK",format=qcow2 \
    -cdrom "$ISO" \
    -boot d \
    -vga std \
    -display none \
    -serial mon:stdio \
    -nic user,model=e1000
EOF

chmod +x "$BASE/iniciar-pc.sh"

echo "Estrutura criada em: $BASE"
echo "Disco virtual de 16 GB criado."
echo "O próximo passo é instalar um sistema operacional."
sh setup_virtual_android.sh

pkg update -y && pkg upgrade -y
pkg install -y qemu-system-x86-64-headless proot-distro wget
termux-setup-storage
